name: Update Premier League fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,9,17 * * *"

permissions:
  contents: write

concurrency:
  group: update-epl-fixtures
  cancel-in-progress: false

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current season fixtures when API token is configured
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          EPL_SEASON_START: "2026"
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "Fixture updater is waiting for the FOOTBALL_DATA_TOKEN repository secret."
          else
            node scripts/update-epl-fixtures.mjs
          fi

      - name: Fetch official Fantasy Premier League player pool
        run: node scripts/update-epl-players.mjs

      - name: Commit updated football data
        run: |
          if git diff --quiet -- data/epl-fixtures.json data/epl-players.json; then
            echo "Football data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epl-fixtures.json data/epl-players.json
          git commit -m "Update Premier League fixtures and player pool"
          git push
