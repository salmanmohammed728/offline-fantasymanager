name: Update Premier League fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,9,17 * * *"

permissions:
  contents: write

concurrency:
  group: update-epl-fixtures
  cancel-in-progress: false

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current season fixtures
        if: ${{ secrets.FOOTBALL_DATA_TOKEN != '' }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          EPL_SEASON_START: "2026"
        run: node scripts/update-epl-fixtures.mjs

      - name: Explain missing API token
        if: ${{ secrets.FOOTBALL_DATA_TOKEN == '' }}
        run: echo "Add FOOTBALL_DATA_TOKEN under Settings > Secrets and variables > Actions to enable fixture updates."

      - name: Commit updated fixture data
        if: ${{ secrets.FOOTBALL_DATA_TOKEN != '' }}
        run: |
          if git diff --quiet -- data/epl-fixtures.json; then
            echo "Fixture data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epl-fixtures.json
          git commit -m "Update Premier League fixtures"
          git push
